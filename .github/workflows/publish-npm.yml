name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Update npm
        # Trusted Publishing (OIDC) needs npm CLI >=11.5.1 — newer than what some
        # Node versions bundle by default.
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx ng test ngx-cmdk --watch=false

      - name: Build ngx-cmdk library
        run: npx ng build ngx-cmdk

      - name: Publish to npm
        working-directory: dist/ngx-cmdk
        run: npm publish --access public
